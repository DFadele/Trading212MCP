[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trading212-mcp"
version = "0.1.0"
description = "Read-only Trading 212 portfolio tools over MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.30,<2",
    "httpx>=0.28,<1",
    "uvicorn>=0.35,<1",
    "starlette>=0.40,<2",
    "PyJWT[crypto]>=2.10,<3",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.9,<3",
    "numpy>=2.2,<3",
    "pandas>=2.2,<4",
    "yfinance>=1.8,<2",
    "cvxpy>=1.7,<2",
    "scikit-learn>=1.6,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.12,<1",
    "pyright>=1.1,<2",
    "pandas-stubs>=2.2,<4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src", "scripts"]
extraPaths = ["src", "scripts", "tests"]
typeCheckingMode = "strict"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[project.scripts]
trading212-mcp = "trading212_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/trading212_mcp"]
