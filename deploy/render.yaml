# Optional paid single-instance example, not deployed automatically.
# Create a service manually or import this file only after reviewing costs.
services:
  - type: web
    name: trading212-mcp
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    numInstances: 1
    healthCheckPath: /readyz
    maxShutdownDelaySeconds: 60
    disk:
      name: public-metadata
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: MCP_AUTH_MODE
        value: oauth
      - key: MCP_TRANSPORT
        value: streamable-http
      - key: MCP_HOST
        value: 0.0.0.0
      - key: MCP_PORT
        value: "10000"
      - key: MCP_PUBLIC_URL
        sync: false
      - key: MCP_OAUTH_ISSUER
        sync: false
      - key: MCP_OAUTH_JWKS_URL
        sync: false
      - key: MCP_OAUTH_SUBJECT
        sync: false
      - key: TRADING212_API_KEY
        sync: false
      - key: TRADING212_API_SECRET
        sync: false
      - key: TRADING212_ENVIRONMENT
        value: demo
      - key: MARKET_SEC_USER_AGENT
        sync: false
